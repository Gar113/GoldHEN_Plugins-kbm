; ===================================================
;  kbm.cfg - konfigurasi plugin Keyboard & Mouse PS4
;  Taruh di: /data/GOLDHEN/kbm.cfg
;  Format:  key=value   (satu per baris)
;  Baris diawali ; atau # dianggap komentar
;  Ubah nilai -> restart game (config dibaca saat plugin load)
; ===================================================

; ---------------------------------------------------
; SENSITIVITAS MOUSE (kamera)
;   1  = sangat lambat / presisi tinggi (sniper)
;   14 = default
;   25 = cepat
;   50 = sangat cepat (cepat pusing)
;   batas: 1 - 200
; ---------------------------------------------------
sens=14

; ---------------------------------------------------
; BALIK SUMBU VERTIKAL
;   0 = normal (geser mouse ke atas -> kamera naik)
;   1 = terbalik (inverted, seperti flight stick)
; ---------------------------------------------------
invert_y=0

; ---------------------------------------------------
; DEADZONE
;   Gerakan mouse di bawah nilai ini diabaikan.
;   Berguna supaya kamera tidak bergetar saat mouse diam.
;   0  = paling responsif (tapi bisa goyang)
;   1  = default
;   20 = maksimum (kamera terasa "berat" di awal)
;   batas: 0 - 20
; ---------------------------------------------------
deadzone=1

; ---------------------------------------------------
; CURVE (kelengkungan respons)
;   Mengatur perbandingan gerakan lambat vs cepat.
;   1   = hampir linear (paling mirip mouse PC)
;   20  = default (seimbang: aim presisi + putar cepat)
;   200 = sangat "akseleratif" (lambat sangat presisi,
;         tapi gerakan cepat langsung ngebut)
;   batas: 1 - 200
; ---------------------------------------------------
curve=20

; ---------------------------------------------------
; SMOOTHING (perataan gerakan)
;   Membuat kamera lebih halus tapi sedikit "delay".
;   0 = tanpa smoothing (paling responsif / mentah)
;   1 = default (seimbang, delay minimal)
;   8 = paling halus (ada rasa lag)
;   batas: 0 - 8
; ---------------------------------------------------
smooth=1

; ---------------------------------------------------
; MAX (batas dorongan stik per frame)
;   Mencegah kamera "over-swing" saat mouse digerakkan
;   sangat cepat. Nilai kecil = putaran lebih terkendali.
;   60  = default
;   127 = tanpa pembatasan
;   batas: 10 - 127
; ---------------------------------------------------
max=60


; ===================================================
;  CONTOH SETELAN SIAP PAKAI
; ===================================================

; --- FPS kompetitif (responsif, kamera cepat) ---
; sens=20
; curve=10
; smooth=0
; deadzone=1
; max=80

; --- Sniper / presisi tinggi ---
; sens=8
; curve=60
; smooth=2
; deadzone=2
; max=40

; --- Terasa paling mirip mouse PC ---
; sens=28
; curve=1
; smooth=0
; deadzone=0
; max=100

; --- Kalau kamera terasa lambat/berat (delay) ---
; smooth=0
; curve=10
; sens=20
; deadzone=0

; --- Kalau kamera terlalu liar / susah dikontrol ---
; max=35
; smooth=2
; sens=10
