; ===================================================
;  kbm.cfg - konfigurasi plugin Keyboard & Mouse PS4
;  Taruh di: /data/GOLDHEN/kbm.cfg
;  Format:  key=value   (satu per baris)
;  Baris diawali ; atau # dianggap komentar
;  Ubah nilai -> restart game (config dibaca saat plugin load)
; ===================================================

; ---------------------------------------------------
; SENSITIVITAS MOUSE (kamera)
;   Menentukan berapa jauh kamera berputar per 10 px gerakan mouse.
;   Nilai ini SEKARANG benar-benar berpengaruh: gerakan yang melebihi
;   batas per frame tidak lagi dibuang, tapi dicicil ke frame
;   berikutnya. Jadi menaikkan sens selalu terasa.
;   1  = sangat lambat / presisi tinggi (sniper)
;   14 = default (lebih berat dari analog)
;   20 = ringan, mendekati analog
;   30 = cepat, mendekati mouse PC
;   50 = sangat cepat (mudah pusing)
;   80+ = ekstrem
;   batas: 1 - 200
; ---------------------------------------------------
sens=30

; ---------------------------------------------------
; BALIK SUMBU VERTIKAL
;   0 = normal (geser mouse ke atas -> kamera naik)
;   1 = terbalik (inverted, seperti flight stick)
; ---------------------------------------------------
invert_y=0

; ---------------------------------------------------
; DEADZONE
;   Gerakan mouse di bawah nilai ini diabaikan.
;   Berguna supaya kamera tidak bergetar saat mouse diam.
;   0  = paling responsif (tapi bisa goyang)
;   1  = default
;   20 = maksimum (kamera terasa "berat" di awal)
;   batas: 0 - 20
; ---------------------------------------------------
deadzone=1

; ---------------------------------------------------
; CURVE (tambahan kecepatan)
;   Tambahan LINEAR pada kecepatan kamera. Karena tambahannya juga
;   linear (bukan kurva kuadratik seperti dulu), nilai ini TIDAK
;   menimbulkan delay - hanya menambah kecepatan keseluruhan.
;   1   = tanpa tambahan (paling murni, paling mirip mouse PC)
;   20  = default (tambahan tipis)
;   40  = tambahan sedang
;   100 = tambahan besar
;   Efek nyata: sens=30 curve=20  sama dengan  sens=31 curve=1.
;   Jadi kalau ingin menyetel kecepatan, pakai 'sens' saja dan biarkan
;   curve=1 supaya angkanya mudah dibaca.
;   batas: 1 - 200
; ---------------------------------------------------
curve=20

; ---------------------------------------------------
; SMOOTHING (perataan gerakan)
;   SUDAH TIDAK DIPAKAI. Dulu nilai ini meratakan gerakan antar
;   frame, dan perataan itulah yang terasa sebagai DELAY. Sekarang
;   jalur kamera langsung memakai nilai terkini, jadi tidak ada lagi
;   penundaan. Baris ini tetap dibaca supaya file cfg lama tidak
;   dianggap rusak, tapi isinya tidak berpengaruh apa pun.
;   Kalau ingin gerakan lebih halus, turunkan sens - bukan naikkan ini.
;   batas: 0 - 8 (tidak berpengaruh)
; ---------------------------------------------------
smooth=0

; ---------------------------------------------------
; MAX (batas dorongan stik per frame)
;   Batas maksimum nilai stik dalam satu frame (stik memang hanya
;   bisa -127..127). Gerakan yang melebihi batas ini TIDAK hilang:
;   sisanya dicicil ke frame berikutnya, jadi kamera tetap sampai
;   tujuan, hanya lebih halus/bertahap.
;   Pada dasarnya biarkan 127. Turunkan hanya kalau ingin putaran
;   terasa lebih bertahap (mis. untuk merekam video).
;   127 = default
;   batas: 10 - 127
; ---------------------------------------------------
max=127


; ===================================================
;  CONTOH SETELAN SIAP PAKAI
;
;  Catatan: 'smooth' sudah tidak berpengaruh sama sekali, dan 'curve'
;  hanya menambah kecepatan secara linear (sama saja dengan menaikkan
;  sens). Jadi yang benar-benar perlu kamu setel hanya dua:
;     sens      -> kecepatan kamera
;     max       -> batas putaran per frame (biarkan 127)
;  Kalau kamera terasa lambat, NAIKKAN sens. Kalau terlalu liar,
;  TURUNKAN sens. Tidak ada gunanya mengutak-atik smooth.
; ===================================================

; --- FPS kompetitif: kamera cepat & langsung ---
; sens=30
; curve=1
; deadzone=1
; max=127

; --- Sniper / presisi tinggi: lambat & halus ---
; sens=10
; curve=1
; deadzone=1
; max=127

; --- Paling mirip mouse PC ---
; sens=35
; curve=1
; deadzone=0
; max=127

; --- Kalau kamera terasa terlalu cepat / susah dikontrol ---
; sens=20
; curve=1
; max=127

; --- Kalau kamera terasa kurang cepat ---
; sens=45
; curve=1
; max=127
